# /etc/dvbs2.conf -- dvbs2_adrv service settings (dvbs2_adrv --help lists all keys).
# "Save settings" on the web page rewrites this file.  Restart: systemctl restart dvbs2

mode = trx                 # tx | rx | trx
web = 80                   # web page port (0 = off)

tx-freq = 2.45e9           # Hz
rx-freq = 2.45e9
bw = 2e6                   # occupied bandwidth Rs (1 + roll-off), 0.4 .. 8.4 MHz (one rate for TX and RX)
tx-gain = 50               # 0 .. 89.75 dB (= 89.75 - attenuation)
rx-gain = 40               # dB (manual gain)

modcod = 4                 # 1..10 QPSK 1/4..8/9, 12..16 8PSK 3/5..8/9
pilots = 1
rolloff = 35               # 35 | 25 | 20
max-iter = 25

tx-on = 1                  # transmit after boot
rx-on = 1
data = udp                 # udp | prbs
udp-in = 0.0.0.0:5000      # TX payload: datagrams received on this port
udp-out = @BROADCAST@:5001 # RX payload: recovered datagrams sent here
file-dir = /var/lib/dvbs2
