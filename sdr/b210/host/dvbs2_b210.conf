# dvbs2_b210.conf -- example configuration: sudo ./dvbs2_b210 --config dvbs2_b210.conf
# "key = value", keys are the long option names (dvbs2_b210 --help lists all), # starts a comment.
# Options given on the command line override the file.
#
# Two-way IP link: station 1 = 10.60.0.1, station 2 = 10.60.0.2. Both stations use the same file
# and differ only in "host" (or: sudo ./dvbs2_b210 --config dvbs2_b210.conf --host 2).
# Each station sends and receives on its own address; dvbs0 has carrier only while both directions
# of the DVB-S2 link are decoded.

host = 1                      # station number: dvbs0 = <subnet>.N, mode trx
# subnet = 10.60.0.0/24
fpga = usrp_b210_dvbs2_fpga.bin
# args = serial=3xxxxxx       # select a B210

# ---- RF: host 1 transmits on freq and receives on freq + duplex, the other host the other way round
freq = 2.45e9                 # Hz
duplex = 10e6                 # Hz between the two directions
bw = 2e6                      # occupied bandwidth Rs (1 + roll-off), sets the symbol rate (or rs = ...)
tx-gain = 60                  # dB
rx-gain = 40                  # dB
# tx-ant = TX/RX
# rx-ant = RX2
# ref = internal              # internal | external | gpsdo

# ---- modem (TX; RX decodes MODCOD and pilots, roll-off must match)
modcod = 13                   # 1..10 QPSK 1/4..8/9, 12..16 8PSK 3/5..8/9 (13 = 8PSK 2/3)
rolloff = 35                  # 35 | 25 | 20
# no-pilots = 1
# max-iter = 25

# ---- TUN interface
# tun = dvbs0
# tun-mtu = 1500

# ---- web page
web = 8080                    # 0 = off
# web-bind = 0.0.0.0          # open the page from other computers
on = 1                        # TX and RX on at start
# file-dir = dvbs2_files

# ---- one-way link instead (UDP only): remove host, set mode = tx (10.60.0.1) or mode = rx (10.60.0.2), tun = dvbs0
